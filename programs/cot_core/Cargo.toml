[package]
name = "cot_core"
version = "0.1.0"
description = "Crypto of Thrones core program: reward vault, signed claim vouchers, fee split and referrals for the game token"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "cot_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
devnet = []
test-sbf = []

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "solana-v3"] }
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"
spl-token-2022-interface = "2.1.0"
solana-security-txt = "1.1.3"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
litesvm = { version = "0.18.2", features = ["precompiles"] }
solana-clock = "~3.2.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "4.2.4"
solana-instruction = "~3.5.0"
solana-address = "~2.7.0"
solana-account = "4.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
